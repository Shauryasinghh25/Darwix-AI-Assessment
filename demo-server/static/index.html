<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grounded AI Review Desk — Darwix AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0A;
      --panel-bg: rgba(255, 255, 255, 0.03);
      --panel-border: rgba(255, 255, 255, 0.06);
      
      --text-main: #FFFFFF;
      --text-muted: #A1A1AA;
      --text-dim: #71717A;

      --accent: #E4E4E7;
      --accent-hover: #FFFFFF;
      --accent-bg: rgba(255, 255, 255, 0.1);
      
      --success: #34D399;
      --success-bg: rgba(52, 211, 153, 0.1);
      --info: #60A5FA;
      --info-bg: rgba(96, 165, 250, 0.1);
      --warn: #FBBF24;
      --warn-bg: rgba(251, 191, 36, 0.1);
      --error: #F87171;
      --error-bg: rgba(248, 113, 113, 0.1);

      --code-bg: #111111;
      --code-text: #E4E4E7;
      
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      background: var(--bg);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Layout Shell */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation Header */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo svg {
      width: 18px;
      height: 18px;
      fill: var(--bg);
    }

    .brand-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    .header-center {
      display: flex;
      align-items: center;
    }

    .page-title-tag {
      display: flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
    }

    .page-title-tag h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.1px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    /* Main Body Layout */
    .body-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      flex: 1;
    }

    /* Sidebar Navigation */
    aside {
      background: var(--bg);
      border-right: 1px solid var(--panel-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      padding: 0 12px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      transition: var(--transition);
    }

    nav a:hover {
      color: var(--text-main);
      background: var(--panel-bg);
    }

    nav a.active {
      color: var(--bg);
      background: var(--text-main);
    }

    nav a .nav-icon {
      width: 16px;
      height: 16px;
      opacity: 0.8;
      transition: var(--transition);
    }

    nav a.active .nav-icon {
      opacity: 1;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .sidebar-footer strong {
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    /* Main Workspace Content Area */
    main {
      padding: 32px;
      overflow-y: auto;
    }

    /* Dynamic Grid Layouts */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    /* Panels & Cards */
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .panel-title h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .panel-title .badge {
      background: transparent;
      border: 1px solid var(--panel-border);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    p.intro-text {
      margin: 0 0 20px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Live Recording Status Banner */
    .recording-banner {
      background: var(--error-bg);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--error);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
    }

    .recording-banner.active {
      border-color: rgba(248, 113, 113, 0.5);
    }

    .recording-banner.saved {
      background: var(--success-bg);
      border-color: rgba(52, 211, 153, 0.2);
      color: var(--success);
    }

    /* Inputs & Form Controls */
    textarea, input, select {
      width: 100%;
      background: transparent;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      padding: 14px 16px;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
      outline: none;
      transition: var(--transition);
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    select {
      font-family: "Inter", sans-serif;
      cursor: pointer;
    }
    select option { background: var(--bg); }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    /* Buttons */
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--text-main);
      color: var(--bg);
      border: 1px solid transparent;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
    }

    button:hover {
      background: var(--accent);
    }

    button:active {
      transform: scale(0.98);
    }

    button.alt {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--panel-border);
    }
    
    button.alt:hover {
      background: var(--panel-bg);
      border-color: var(--text-muted);
    }

    button.gold, button.warn {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--panel-border);
    }
    
    button.gold:hover {
      border-color: var(--warn);
      color: var(--warn);
    }

    button.warn:hover {
      border-color: var(--error);
      color: var(--error);
    }

    /* Output Code Block */
    pre {
      margin: 0;
      min-height: 240px;
      max-height: 480px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--code-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      color: var(--code-text);
      padding: 20px;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    /* Accordion / Proof Section */
    details {
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-top: 20px;
      transition: var(--transition);
    }

    details:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    summary {
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
      color: var(--text-muted);
      user-select: none;
      outline: none;
    }

    summary:hover {
      color: var(--text-main);
    }

    .proof {
      margin: 12px 0 4px 16px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.6;
    }

    .proof li {
      margin-bottom: 6px;
    }

    /* Reviewer View / Timeline Cards */
    .readable {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }

    .turn {
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--success);
      background: transparent;
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .turn.user {
      border-left-color: var(--info);
    }

    .turn strong {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .turn small {
      display: block;
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 11px;
    }

    .nudge {
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--warn);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 13px;
      color: var(--text-main);
      line-height: 1.6;
    }

    .nudge strong {
      color: var(--warn);
      font-weight: 500;
    }

    /* Metrics Grid */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric {
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-sm);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .metric strong {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .metric small {
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
    }

    /* Responsive Breakdown */
    @media (max-width: 1024px) {
      .body-layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--panel-border); padding-bottom: 16px; }
      .workspace-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="header-bar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-name">DARWIX AI</span>
          <span class="brand-sub">Grounded AI Review Desk</span>
        </div>
      </div>
      <div class="header-center">
        <div class="page-title-tag">
          <h2 id="pageTitle">Overview</h2>
        </div>
      </div>
      <div class="header-right">
        <div class="status-badge">
          <span class="status-dot"></span>
          <span>127.0.0.1:8088</span>
        </div>
      </div>
    </header>

    <!-- Main Body with Sidebar & Content -->
    <div class="body-layout">
      <aside>
        <div class="nav-label">Prototypes & Modules</div>
        <nav id="nav">
          <a href="/" data-route="/">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            Overview
          </a>
          <a href="/Knowledge" data-route="/Knowledge">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            Knowledge Base
          </a>
          <a href="/Voice" data-route="/Voice">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/></svg>
            Voice Agent
          </a>
          <a href="/Regional" data-route="/Regional">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
            Regional Bots
          </a>
          <a href="/Realtime" data-route="/Realtime">
            <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            Realtime Analytics
          </a>
        </nav>
        <div class="sidebar-footer">
          <strong>Reviewer Desk v1.0</strong>
          Grounded AI Workflows for Insurance & Finance
        </div>
      </aside>

      <main>
        <div id="app"></div>
      </main>
    </div>
  </div>

  <script>
    const app = document.querySelector('#app');
    const pageTitle = document.querySelector('#pageTitle');
    const state = { transcript: [], recorder: null, chunks: [], recognition: null, isRecording: false };
    const routes = {'/': overview, '/Voice': q1, '/Knowledge': q2, '/Regional': q3, '/Realtime': q4};

    function setActive() {
      document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.route === location.pathname));
    }

    function proof(items) {
      return `<details><summary>Assessment Verification & Coverage (${items.length} checks)</summary><ul class="proof">${items.map(item => `<li>✓ ${item}</li>`).join('')}</ul></details>`;
    }

    function shell(title, intro, input, proofItems) {
      pageTitle.textContent = title;
      app.innerHTML = `
        <div class="workspace-grid">
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <h3>Interactive Console</h3>
                <span class="badge">Input</span>
              </div>
            </div>
            <p class="intro-text">${intro}</p>
            ${input}
            ${proof(proofItems)}
          </div>
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <h3>Structured Output</h3>
                <span class="badge">JSON Payload</span>
              </div>
            </div>
            <pre id="output">Run a test query to inspect JSON evidence.</pre>
          </div>
        </div>
        <div class="panel" style="margin-top:20px">
          <div class="panel-header">
            <div class="panel-title">
              <h3>Reviewer View & Conversation Stream</h3>
              <span class="badge">Live Visualizer</span>
            </div>
          </div>
          <div id="readable" class="readable"></div>
        </div>
      `;
      setActive();
    }

    function overview() {
      pageTitle.textContent = 'Evaluation Overview';
      setActive();
      app.innerHTML = `
        <div class="workspace-grid">
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">
                <h3>System Architecture & Scenario</h3>
              </div>
            </div>
            <p class="intro-text">
              This prototype turns messy insurance and finance content into production-ready grounded AI workflows:
              a searchable vector/retrieval knowledge base, a voice-agent turn handler, localized Taglish & Bahasa regional bots, and real-time streaming call coaching nudges.
            </p>
          </section>
        </div>
      `;
    }

    function q1() {
      shell('Q1 Voice Agent', 'Test the web calling flow with grounded answers, browser speech, recording save, and CRM-style handoff.', `
        <div id="recordingBanner" class="recording-banner">
          <span>💡 <strong>Call Recorder Idle:</strong> Click 'Start Recording' and talk or send turns. Audio & full transcript will save when you click 'Stop and Save'.</span>
        </div>
        <div class="form-group"><label class="form-label">Customer Utterance</label><textarea id="q1text">I need family coverage and a callback later</textarea></div>
        <div class="controls">
          <button onclick="q1Send()">Send Turn</button>
          <button class="alt" onclick="q1Speak()">Speak Input</button>
          <button class="gold" onclick="startRecording()">Start Recording</button>
          <button class="warn" onclick="stopRecording()">Stop and Save</button>
          <button class="alt" onclick="postJson('/api/Voice/scenario',{})">Run Scenario Script</button>
        </div>
      `, ['Uses Q2 retrieval before answering', 'Escalates unsupported or risky requests', 'Writes mock CRM export']);
      renderTranscript();
    }

    function updateRecordingBanner(statusText, isRecording = false, isSaved = false) {
      const banner = document.querySelector('#recordingBanner');
      if (!banner) return;
      banner.className = 'recording-banner' + (isRecording ? ' active' : isSaved ? ' saved' : '');
      banner.innerHTML = statusText;
    }

    function q2() {
      shell('Q2 Knowledge Base', 'Search cleaned business records with citations, categories, retrieval scores, and PII-safe output.', `<div class="form-group"><label class="form-label">Search Query</label><input id="q2text" value="When is the renewal notice sent?"/></div><div class="controls"><button onclick="postJson('/api/Knowledge/search',{question:q2text.value})">Search KB</button><button class="alt" onclick="postJson('/api/Knowledge/build',{})">Rebuild KB Index</button></div>`, ['Cleans messy source data', 'Masks PII and tracks provenance', 'Returns cited retrieval results']);
    }

    function q3() {
      shell('Q3 Localized Bots', 'Test Taglish, Bahasa Indonesia, regional wording, and safe same-language fallback.', `<div class="form-group"><label class="form-label">Target Market & Register</label><select id="market"><option value="ph">Philippines (PH - Taglish)</option><option value="id">Indonesia (ID - Bahasa / Regional)</option></select></div><div class="form-group"><label class="form-label">Customer Query</label><textarea id="q3text">Pwede ba Taglish? I need family beneficiary details.</textarea></div><div class="controls"><button onclick="runQ3()">Send Localized Turn</button><button class="alt" onclick="market.value='ph'; q3text.value='Mahal ba ang premium kung may rider at bank referral?'; runQ3()">PH Objection Sample</button><button class="alt" onclick="market.value='id'; q3text.value='Kulo telat bayar cicilan, pripun denda ne?'; runQ3()">ID Regional Sample</button><button class="warn" onclick="market.value='id'; q3text.value='Apa promo crypto yang dijamin untung?'; runQ3()">Fallback Safety Test</button></div>`, ['Detects language mix and terms', 'Shows localization metadata', 'Preserves safe fallback language']);
    }

    async function runQ3() {
      const payload = await postJson('/api/Regional/respond', {market:market.value, text:q3text.value});
      const box = document.querySelector('#readable');
      box.innerHTML = `
        <div class="turn user"><strong>Customer</strong><br>${escapeHtml(payload.input)}</div>
        <div class="turn"><strong>Localized Bot</strong><br>${escapeHtml(payload.response)}</div>
        <div class="nudge"><strong>English Explanation</strong><br>${escapeHtml(payload.english_explanation || 'No explanation available.')}</div>
        <div class="nudge"><strong>Localization Metadata</strong><br>Intent: ${escapeHtml(payload.intent)} | Register: ${escapeHtml(payload.register)} | Language mix: ${escapeHtml(payload.language_mix)}<br>Terms detected: ${escapeHtml((payload.terms_detected || []).join(', ') || 'none')} | Next action: ${escapeHtml(payload.next_action)}</div>
      `;
    }

    function q4() {
      shell('Q4 Live Nudges', 'Process each line as a live call chunk and inspect latency, nudges, suppression, and false-positive controls.', `<div class="form-group"><label class="form-label">Streaming Call Transcript Chunks</label><textarea id="q4text">Customer: Hello, I have one vehicle on my policy.
Customer: Actually I bought a second car last week.
Customer: Your agent skipped the disclosure and I am getting frustrated.
Customer: I can't pay right now, call me later.</textarea></div><div class="controls"><button onclick="runQ4()">Run Call Stream</button><button class="alt" onclick="q4text.value='Customer: background noise ... okay maybe...\\nCustomer: not sure what you mean ...\\nAgent: just a normal update, nothing urgent\\nCustomer: okay thanks'; runQ4()">Noisy Call Test</button><button class="warn" onclick="q4text.value='Agent: This is guaranteed approval with no risk.\\nCustomer: I bought a second vehicle.\\nCustomer: This is taking too long.'; runQ4()">Risky Statement Test</button></div>`, ['Before-call-end chunk processing', 'Confidence, grouping, suppression', 'P50/P95 and component latency']);
    }

    async function runQ4() {
      const payload = await postJson('/api/Realtime/stream', {chunks:q4text.value.split('\\n').filter(Boolean)});
      const box = document.querySelector('#readable');
      box.innerHTML = `
        <div class="metrics">
          <div class="metric"><strong>${payload.p50_ms} ms</strong><small>P50 Latency</small></div>
          <div class="metric"><strong>${payload.p95_ms} ms</strong><small>P95 Latency</small></div>
          <div class="metric"><strong>${payload.nudges.length}</strong><small>Nudges Emitted</small></div>
        </div>
      `;
      box.innerHTML += '<h4 style="margin:16px 0 8px; color:var(--text-muted)">Live Timeline Chunks</h4>' + payload.timeline.map(item => `
        <div class="turn ${item.speaker === 'customer' ? 'user' : ''}">
          <strong>Chunk ${item.chunk_index} — ${item.speaker}</strong><br>${escapeHtml(item.text)}
          <small>Signals detected: ${item.signals.map(s => s.kind + ' (' + Math.round(s.confidence * 100) + '%)').join(', ') || 'none'}</small>
        </div>
      `).join('');
      
      box.innerHTML += '<h4 style="margin:16px 0 8px; color:var(--text-muted)">Live Nudges Emitted</h4>' + (payload.nudges.length ? payload.nudges.map(n => `
        <div class="nudge">
          <strong>Priority: ${n.nudge.priority}</strong> — ${escapeHtml(n.signal.kind)}<br>${escapeHtml(n.nudge.message)}
          <br><small>Chunk ${n.chunk} | Confidence ${Math.round(n.signal.confidence * 100)}% | Expires in ${n.nudge.expires_in_sec}s</small>
        </div>
      `).join('') : '<div class="nudge">No nudges emitted. Suppression filter active.</div>');
      
      box.innerHTML += `
        <h4 style="margin:16px 0 8px; color:var(--text-muted)">Suppression & Controls</h4>
        <div class="nudge"><pre style="min-height:auto; background:transparent; border:0; padding:0; font-size:12px">${escapeHtml(JSON.stringify(payload.controls, null, 2))}</pre></div>
        <h4 style="margin:16px 0 8px; color:var(--text-muted)">False Positive Analysis</h4>
        <div class="nudge"><pre style="min-height:auto; background:transparent; border:0; padding:0; font-size:12px">${escapeHtml(JSON.stringify(payload.false_positive_analysis, null, 2))}</pre></div>
      `;
    }

    async function q1Send(textOverride) {
      const text = textOverride || document.querySelector('#q1text').value;
      if (!text || !text.trim()) return;
      state.transcript.push({speaker:'customer', text});
      const data = await postJson('/api/Voice/call', {text, transcript: state.transcript.slice(0, -1)});
      state.transcript.push({speaker:'agent', text:data.answer, intent:data.intent, source_ref:data.source_ref});
      speak(data.answer);
      renderTranscript();
      if (state.isRecording) {
        updateRecordingBanner(`🔴 <strong>RECORDING IN PROGRESS...</strong> Turns recorded: ${Math.floor(state.transcript.length / 2)} | Click 'Send Turn', 'Speak Input', or 'Stop and Save'`, true);
      }
    }

    function q1Speak() {
      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Rec) {
        setOutput({error:'SpeechRecognition is not available in this browser. Use text input or Chrome.'});
        return;
      }
      const rec = new Rec();
      rec.lang = 'en-US';
      rec.onresult = e => {
        const text = e.results[0][0].transcript;
        document.querySelector('#q1text').value = text;
        q1Send(text);
      };
      rec.start();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        state.chunks = [];
        state.transcript = []; // Reset transcript for new recording
        state.isRecording = true;
        state.recorder = new MediaRecorder(stream);
        state.recorder.ondataavailable = e => state.chunks.push(e.data);
        state.recorder.start();
        
        updateRecordingBanner('🔴 <strong>RECORDING STARTED!</strong> Microphone audio is active. Speak into mic or click "Send Turn" / "Speak Input".', true);
        setOutput({recording:'started', hint:'Speak or click "Send Turn" / "Speak Input" to build conversation turns before stopping.'});

        // Auto-enable speech recognition if supported
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Rec) {
          state.recognition = new Rec();
          state.recognition.lang = 'en-US';
          state.recognition.onresult = e => {
            const text = e.results[0][0].transcript;
            document.querySelector('#q1text').value = text;
            q1Send(text);
          };
          state.recognition.start();
        }
      } catch (err) {
        updateRecordingBanner('⚠️ Microphone permission error: ' + err.message);
        setOutput({error: err.message});
      }
    }

    async function stopRecording() {
      if (!state.recorder || !state.isRecording) {
        setOutput({recording:'not_started'});
        return;
      }
      state.isRecording = false;
      if (state.recognition) {
        try { state.recognition.stop(); } catch(e) {}
      }

      state.recorder.onstop = async () => {
        const blob = new Blob(state.chunks, {type:'audio/webm'});
        const audio_base64 = await blobToDataUrl(blob);
        const turnCount = Math.floor(state.transcript.length / 2);
        const payload = await postJson('/api/Voice/save-recording', {
          name: 'web-call-' + Date.now(),
          audio_base64,
          transcript: state.transcript
        });
        updateRecordingBanner(`✅ <strong>RECORDING SAVED!</strong> Saved ${turnCount} turns + WebM audio file to evidence/q1/recordings/`, false, true);
      };
      state.recorder.stop();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    function blobToDataUrl(blob) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
      });
    }

    async function postJson(url, data) {
      setOutput({status:'running'});
      const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
      const payload = await res.json();
      setOutput(payload);
      return payload;
    }

    function setOutput(data) {
      const out = document.querySelector('#output');
      if (out) out.textContent = JSON.stringify(data, null, 2);
    }

    function renderTranscript() {
      const box = document.querySelector('#readable');
      if (!box) return;
      box.innerHTML = state.transcript.map(t => `
        <div class="turn ${t.speaker === 'customer' ? 'user' : ''}">
          <strong>${t.speaker}</strong><br>${escapeHtml(t.text)}
          ${t.intent ? `<small>Intent: ${escapeHtml(t.intent)}${t.source_ref ? ' | Source: ' + escapeHtml(t.source_ref) : ''}</small>` : ''}
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    (routes[location.pathname] || overview)();
    setActive();
  </script>
</body>
